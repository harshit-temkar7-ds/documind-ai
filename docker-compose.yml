services:
  documind:
    build: .
    container_name: documind_ai
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEBUG: "false"
      VECTORSTORE_PATH: /app/data/vectorstore
      UPLOAD_FOLDER: /app/data/uploads
      HF_HOME: /app/model-cache
    volumes:
      - documind_data:/app/data
      - hf_cache:/app/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  documind_data:
  hf_cache:
